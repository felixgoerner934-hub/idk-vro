name: Build SpawnerBeacon

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build SpawnerBeacon
        run: gradle build --no-daemon

      - name: Upload SpawnerBeacon JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpawnerBeacon-1.2.0
          path: build/libs/spawnerbeacon-1.2.0.jar
          if-no-files-found: error
